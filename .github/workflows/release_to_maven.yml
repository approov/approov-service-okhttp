name: Release to Maven

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish (for example, 3.5.8)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-to-maven:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CURRENT_TAG: ${{ inputs.release_tag }}
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      PGP_KEY_ID: ${{ secrets.PGP_KEY_ID }}
      GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
    steps:
      - name: Require main branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Release to Maven must be run from the main branch. Selected ref: ${{ github.ref }}"
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release tag and CHANGELOG
        run: |
          TAG="$CURRENT_TAG"

          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$TAG' must use the x.y.z format"
            exit 1
          fi

          CHANGELOG_VERSION=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+') || true
          if [ -z "$CHANGELOG_VERSION" ]; then
            echo "::error::Could not find a version header (## [x.y.z]) in CHANGELOG.md"
            exit 1
          fi
          if [ "$CHANGELOG_VERSION" != "$TAG" ]; then
            echo "::error::CHANGELOG.md top entry ($CHANGELOG_VERSION) does not match release tag ($TAG)"
            exit 1
          fi

          TAG_COMMIT=$(git rev-parse --verify "refs/tags/$TAG^{commit}" 2>/dev/null) || {
            echo "::error::Release tag '$TAG' does not exist in the repository"
            exit 1
          }
          if ! git merge-base --is-ancestor "$TAG_COMMIT" "$GITHUB_SHA"; then
            echo "::error::Release tag '$TAG' does not point to a commit on main"
            exit 1
          fi

          TAG_CHANGELOG_VERSION=$(git show "$TAG_COMMIT:CHANGELOG.md" | grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+') || true
          if [ "$TAG_CHANGELOG_VERSION" != "$TAG" ]; then
            echo "::error::CHANGELOG.md at tag '$TAG' does not have '$TAG' as its top release"
            exit 1
          fi

          echo "Release tag $TAG is valid and matches CHANGELOG.md on main and at the tagged commit."

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q unzip curl
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --silent --show-error -o android-sdk.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-9123335_latest.zip
          unzip -q android-sdk.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/tools"
          rm android-sdk.zip
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/tools/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Required SDK Packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install GPG
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gnupg

      - name: Import GPG Private Key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" > private.key
          gpg --batch --import private.key
          rm private.key

      - name: Trust GPG Key
        run: |
          KEY_ID=$(gpg --list-keys --with-colons | awk -F: '$1 == "pub" { print $5; exit }')
          if [ -z "$KEY_ID" ]; then
            echo "::error::No imported GPG public key was found"
            exit 1
          fi
          printf 'trust\n5\ny\nquit\n' | gpg --batch --yes --command-fd 0 --edit-key "$KEY_ID"

      - name: Build AAR
        run: ./gradlew assembleRelease -PapproovServiceVersion="$CURRENT_TAG"

      - name: Create Package
        working-directory: .maven
        run: ./build-and-sign.sh

      - name: Publish Package
        working-directory: .maven
        run: ./maven-publish.sh

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maven-release-${{ inputs.release_tag }}
          path: .maven/service.okhttp-${{ inputs.release_tag }}.zip
          if-no-files-found: error
          retention-days: 30
