plugins {
    id 'com.android.library'
    id 'maven-publish'
    // only the ShadowJar task type is used, to relocate Tink (see relocatedTinkJar)
    id 'com.gradleup.shadow' version '9.6.1' apply false
}

repositories {
    mavenCentral()
    google()
}

android {
    namespace = "io.approov.service.okhttp"
    compileSdk 34

    buildFeatures {
        // AGP 8 disables BuildConfig generation by default; we need it to expose
        // the service-layer version to runtime code (see APPROOV_SERVICE_VERSION below).
        buildConfig true
    }

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 34
        consumerProguardFiles 'consumer-rules.pro'

        // The published service-layer version, fed by CI from the release git tag
        // (-PapproovServiceVersion=X.Y.Z). Local/test builds get "dev". This is the
        // single source of truth for the version baked into the compiled AAR.
        def serviceVersion = (project.findProperty('approovServiceVersion') ?: 'dev')
        buildConfigField "String", "APPROOV_SERVICE_VERSION", "\"${serviceVersion}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        unitTests {
            includeAndroidResources = false
            returnDefaultValues = true
        }
    }

    sourceSets {
        test {
            java {
                if (findProject(':approov-sdk') == null || findProject(':test-support') == null) {
                    exclude '**/ApproovServiceMiniSdkTest.java'
                }
            }
        }
    }
}

configurations {
    testImplementation {
        exclude group: 'io.approov', module: 'approov-android-sdk'
    }

    // Tink converts the SDK's DER install signature to raw r||s. It is bundled
    // inside the AAR, relocated with its runtime dependencies under this layer's
    // own prefix io.approov.util.okhttp, so apps that ship their own Tink,
    // protobuf or Gson, or another Approov layer with its own relocated copy,
    // never see duplicate classes. The published POM therefore carries no Tink
    // dependency. The version is pinned to approov-service-android's because
    // EllipticCurves sits in Tink's subtle package, which has no API stability
    // promise; Es256DerToRawTest pins its behaviour.
    relocatedTink {
        canBeConsumed = false
        canBeResolved = true
    }
}

def relocatedTinkJar = tasks.register('relocatedTinkJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    description = 'Bundles Tink and its runtime dependencies relocated under io.approov.util.okhttp.'
    archiveBaseName.set('approov-okhttp-relocated-tink')
    archiveVersion.set('')
    archiveClassifier.set('')
    destinationDirectory.set(layout.buildDirectory.dir('relocated-tink'))
    configurations = [project.configurations.relocatedTink]
    relocate 'com.google.crypto.tink', 'io.approov.util.okhttp.tink'
    relocate 'com.google.gson', 'io.approov.util.okhttp.gson'
    relocate 'com.google.errorprone.annotations', 'io.approov.util.okhttp.errorprone.annotations'
    relocate 'javax.annotation', 'io.approov.util.okhttp.jsr305'
    // embedded R8 rules name the old packages; the one Tink rule that is still
    // relevant is restated for the relocated package in consumer-rules.pro
    exclude 'META-INF/**'
    exclude '**/module-info.class'
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.approov:approov-android-sdk:3.5.3'
    relocatedTink('com.google.crypto.tink:tink-android:1.23.0') {
        // androidx.annotation is a regular dependency of this library below
        exclude group: 'androidx.annotation'
    }
    implementation files(relocatedTinkJar)
    implementation 'androidx.annotation:annotation-jvm:1.9.1'
    testImplementation 'junit:junit:4.13.2'
    if (findProject(':approov-sdk') != null) {
        testImplementation project(':approov-sdk')
    }
    if (findProject(':test-support') != null) {
        testImplementation project(':test-support')
    }
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'org.json:json:20231013'
    // self-signed TLS material for the pin check tests
    testImplementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'
    // local HTTPS server for the request-before-initialize and bypass pinning tests
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'androidx.test:core:1.6.1'
}

def releaseAar = layout.buildDirectory.file('outputs/aar/approov-service-release.aar')
tasks.register('verifyReleaseAar') {
    group = 'verification'
    description = 'Inspects the release AAR for required content and for bundled libraries that are not relocated under this layer.'
    dependsOn 'bundleReleaseAar'
    inputs.file(releaseAar)
    doLast {
        def archive = releaseAar.get().asFile
        assert archive.isFile(): "release AAR not found: ${archive}"
        def aar = new java.util.zip.ZipFile(archive)
        try {
            assert aar.getEntry('classes.jar') != null: 'release AAR has no classes.jar'
            def rulesEntry = aar.getEntry('proguard.txt')
            assert rulesEntry != null: 'release AAR has no consumer ProGuard rules'
            def rules = aar.getInputStream(rulesEntry).getText('UTF-8')
            assert rules.contains('io.approov.util.okhttp.tink.shaded.protobuf.GeneratedMessageLite'):
                    'consumer rules do not restate the Tink protobuf rule for the relocated package'
            // Tink must stay shrinkable: no rule may keep its classes wholesale
            assert !(rules =~ /-keep[a-z]*\s+class\s+io\.approov\.util\.okhttp\.tink/):
                    'consumer rules keep relocated Tink classes'

            def required = [
                    'io/approov/service/okhttp/ApproovService.class',
                    'io/approov/service/okhttp/ApproovDefaultMessageSigning.class',
                    'io/approov/util/okhttp/tink/subtle/EllipticCurves.class',
                    'io/approov/util/okhttp/http/sfv/Parser.class',
                    'io/approov/util/okhttp/sig/SignatureBaseBuilder.class'
            ] as Set
            // anything bundled must be relocated under this layer's own prefix so that
            // it cannot collide with an app's own copy or with another Approov layer
            def forbidden = [
                    'org/bouncycastle/': 'BouncyCastle',
                    'io/approov/internal/': 'the former BouncyCastle relocation',
                    'com/google/': 'unrelocated Google (Tink, protobuf, Gson, Error Prone)',
                    'javax/annotation/': 'unrelocated JSR-305',
                    'okhttp3/': 'OkHttp (a dependency, never bundled)',
                    'com/criticalblue/': 'the Approov SDK (a dependency, never bundled)',
                    // the pre-relocation names that other Approov Android layers ship
                    'io/approov/util/http/': 'colliding Structured Fields',
                    'io/approov/util/sig/': 'colliding message-signature',
                    'io/approov/util/universal/': 'approov-service-android\'s relocated classes'
            ]
            def found = [] as Set
            def jars = aar.entries().findAll { it.name == 'classes.jar' || (it.name.startsWith('libs/') && it.name.endsWith('.jar')) }
            jars.each { jar ->
                def classes = new java.util.zip.ZipInputStream(aar.getInputStream(jar))
                try {
                    for (def entry = classes.nextEntry; entry != null; entry = classes.nextEntry) {
                        if (required.contains(entry.name)) found.add(entry.name)
                        forbidden.each { prefix, what ->
                            assert !entry.name.startsWith(prefix): "AAR ${jar.name} bundles ${what} class ${entry.name}"
                        }
                        if (entry.name.endsWith('.class')) {
                            assert entry.name.startsWith('io/approov/service/okhttp/') || entry.name.startsWith('io/approov/util/okhttp/'):
                                    "AAR ${jar.name} bundles class ${entry.name} outside this layer's packages"
                        }
                    }
                } finally {
                    classes.close()
                }
            }
            assert found == required: "release AAR missing entries: ${required - found}"
        } finally {
            aar.close()
        }
    }
}

tasks.register('verifyPublishedPom') {
    group = 'verification'
    description = 'Checks that the POM published with the AAR lists no bundled or removed library.'
    def pomFile = layout.projectDirectory.file('pom.xml')
    inputs.file(pomFile)
    doLast {
        def dependencies = new groovy.xml.XmlSlurper().parse(pomFile.asFile).dependencies.dependency
        def artifacts = dependencies.collect { it.groupId.text() + ":" + it.artifactId.text() } as Set
        ['com.squareup.okhttp3:okhttp', 'io.approov:approov-android-sdk'].each {
            assert artifacts.contains(it): "published POM is missing runtime dependency ${it}"
        }
        // BouncyCastle is gone and Tink is bundled relocated, so none of these may be
        // a dependency of the published library
        def groups = dependencies.collect { it.groupId.text() } as Set
        ['org.bouncycastle', 'com.google.crypto.tink', 'com.google.code.gson',
         'com.google.errorprone', 'com.google.code.findbugs'].each {
            assert !groups.contains(it): "bundled or removed library listed in the published POM: ${it}"
        }
    }
}

// the Approov SDK version this layer depends on, read from its declared dependency
def approovSdkDependencyVersion = configurations.implementation.dependencies
        .find { (it.group == 'io.approov') && (it.name == 'approov-android-sdk') }?.version

tasks.register('verifyReleaseSdkVersion') {
    group = 'verification'
    description = 'Fails a 3.8.x or later release whose Approov SDK dependency is 3.5.x. Only the release path runs it, ' +
            'so development and tests may stay on a 3.5.x SDK.'
    def pomFile = layout.projectDirectory.file('pom.xml')
    def releaseVersion = project.findProperty('approovServiceVersion')?.toString()
    def gradleSdkVersion = approovSdkDependencyVersion
    inputs.file(pomFile)
    doLast {
        if (!(releaseVersion ==~ /\d+\.\d+\.\d+/))
            throw new GradleException("verifyReleaseSdkVersion: release version must be x.y.z " +
                    "(-PapproovServiceVersion), got ${releaseVersion}")
        def pomSdk = new groovy.xml.XmlSlurper().parse(pomFile.asFile).dependencies.dependency
                .find { (it.groupId.text() == 'io.approov') && (it.artifactId.text() == 'approov-android-sdk') }
        def sdkVersions = ['build.gradle': gradleSdkVersion, 'pom.xml': pomSdk?.version?.text()]
        sdkVersions.each { where, version ->
            if (!version)
                throw new GradleException("verifyReleaseSdkVersion: no Approov SDK dependency in ${where}")
        }

        // the 3.8.x line needs the 3.8.0 SDK, and the 3.5.x SDK reports statuses (MITM_DETECTED) that it no
        // longer handles once released
        def (major, minor) = releaseVersion.tokenize('.').collect { it as int }
        if ((major > 3) || ((major == 3) && (minor >= 8))) {
            sdkVersions.each { where, version ->
                if (version ==~ /3\.5(\..*)?/)
                    throw new GradleException("verifyReleaseSdkVersion: release ${releaseVersion} depends on " +
                            "Approov SDK ${version} in ${where}, a 3.8.x or later release needs SDK 3.8.0 or later")
            }
        }
        logger.lifecycle("Release ${releaseVersion}: Approov SDK ${sdkVersions['build.gradle']} accepted")
    }
}
