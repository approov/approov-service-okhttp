android.useAndroidX=true
# The OkHttp the package compiles against and depends on: the minimum an app gets, since Gradle resolves
# the highest OkHttp an app's dependencies ask for. OkHttp 5 races IPv6 and IPv4 addresses (fast
# fallback) for the app's calls and the Approov SDK's. approov-service/pom.xml names the same version,
# and verifyPublishedPom fails when they disagree.
okhttpVersion=5.3.2
